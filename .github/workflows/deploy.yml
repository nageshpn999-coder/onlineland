name: Deploy Firebase (rules, indexes, functions, admin dashboard)

# Run by hand: Actions → "Deploy Firebase" → Run workflow → dev or prod (needs this file on main).
# Before launch (main still holds the old site) dev is deployed by pushing develop to the deploy-dev branch.
# That branch can only deploy to onlineland-dev; prod is only ever by hand.
# Deploys ONLY to onlineland-dev or onlineland-prod. Any other project is refused, so the existing
# projects (onlineland-28234, vahan-3e329, ridekart-70332, scraplake) can never be touched from here.
#
# Needs the secret FIREBASE_SERVICE_ACCOUNT_DEV / FIREBASE_SERVICE_ACCOUNT_PROD: the JSON key of a
# service account created inside that one project (see docs/LAUNCH.md). Values are never printed.

on:
  push:
    branches: [deploy-dev]
  workflow_dispatch:
    inputs:
      target:
        description: Firebase project
        type: choice
        options: [dev, prod]
        default: dev
      only:
        description: What to deploy
        type: choice
        options: ['firestore,storage,functions,hosting', 'firestore,storage', 'functions', 'hosting']
        default: 'firestore,storage,functions,hosting'

concurrency: deploy-${{ inputs.target || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'prod' && 'production' || 'development' }}
    env:
      PROJECT: ${{ inputs.target == 'prod' && 'onlineland-prod' || 'onlineland-dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tests first (rules + functions on emulators)
        run: npm run test:firebase

      - name: Service account (must belong to the chosen project)
        env:
          SA: ${{ inputs.target == 'prod' && secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          case "$PROJECT" in onlineland-dev|onlineland-prod) ;; *) echo "::error::Refusing project $PROJECT"; exit 1;; esac
          [ -n "$SA" ] || { echo "::error::Service account secret for $PROJECT is not set"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          SA_PROJECT=$(node -e "console.log(require(process.argv[1]).project_id)" "$RUNNER_TEMP/sa.json")
          if [ "$SA_PROJECT" != "$PROJECT" ]; then
            echo "::error::The service account belongs to another project. Refusing to deploy."; rm -f "$RUNNER_TEMP/sa.json"; exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Let Storage rules read Firestore (one-time IAM grant, safe to repeat)
        run: |
          # storage.rules call firestore.get() to check who owns a listing; Storage's service agent needs this role.
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          NUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          gcloud projects add-iam-policy-binding "$PROJECT" --quiet --condition=None \
            --member="serviceAccount:service-$NUM@gcp-sa-firebasestorage.iam.gserviceaccount.com" \
            --role="roles/firebaserules.firestoreServiceAgent" --format=none && echo "Storage → Firestore access granted"
          gcloud auth revoke --all --quiet || true

      - name: Build the admin dashboard with this project's web config
        if: contains(inputs.only || 'hosting', 'hosting')
        run: |
          # The web config is public by design (it ships to every browser); read it from the project, never from chat.
          npx firebase apps:sdkconfig WEB --project "$PROJECT" > "$RUNNER_TEMP/webconfig.txt"
          node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8");
            const c = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
            const m = { apiKey: "API_KEY", authDomain: "AUTH_DOMAIN", projectId: "PROJECT_ID", storageBucket: "STORAGE_BUCKET", messagingSenderId: "MESSAGING_SENDER_ID", appId: "APP_ID" };
            for (const [k, n] of Object.entries(m)) if (c[k]) console.log(`NEXT_PUBLIC_FIREBASE_${n}=${c[k]}`);
          ' "$RUNNER_TEMP/webconfig.txt" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/webconfig.txt"
      - name: Admin build
        if: contains(inputs.only || 'hosting', 'hosting')
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          [ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" = "$PROJECT" ] || { echo "::error::Web config is not for $PROJECT"; exit 1; }
          npm run build -w @onlineland/admin
          rm -rf firebase/admin-site && cp -r apps/admin/out firebase/admin-site

      - name: Deploy to ${{ env.PROJECT }}
        env:
          ONLY: ${{ inputs.only || 'firestore,storage,functions,hosting' }}
        run: npx firebase deploy --config firebase/firebase.json --project "$PROJECT" --only "$ONLY" --non-interactive --force

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
