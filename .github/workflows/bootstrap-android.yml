name: Bootstrap Android app (one-time)

# Creates the Flutter project skeleton in apps/android and commits it to develop.
# Runs once; this workflow file is deleted afterwards.
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/bootstrap-android.yml']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: flutter --version
      - name: Create Flutter project
        working-directory: apps/android
        run: |
          flutter create --platforms=android --org in.onlineland --project-name onlineland --description "OnlineLand — Find Your Perfect Property" .
          flutter pub add firebase_core firebase_auth cloud_firestore firebase_storage cloud_functions firebase_messaging \
            flutter_riverpod go_router cached_network_image url_launcher image_picker flutter_image_compress \
            geolocator shared_preferences intl
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub get
          echo "----- pubspec.yaml -----"; cat pubspec.yaml
          echo "----- resolved versions -----"; grep -E "^  (firebase_core|firebase_auth|cloud_firestore|firebase_storage|cloud_functions|firebase_messaging|flutter_riverpod|go_router|cached_network_image|url_launcher|image_picker|flutter_image_compress|geolocator|shared_preferences|intl):" -A3 pubspec.lock | grep -E "^  [a-z_]+:|version:"
          echo "----- android files -----"; find android -maxdepth 4 -type f | sort
      - name: Commit skeleton
        run: |
          git config user.name "nageshpn999-coder"
          git config user.email "nageshpn999-coder@users.noreply.github.com"
          git add apps/android
          git commit -m "Phase 6: Flutter project skeleton (flutter create + packages)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011Lyvim7gvxisJdDhxtFeAd"
          git push origin HEAD:develop
