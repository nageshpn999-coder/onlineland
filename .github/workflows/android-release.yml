name: Android release (Play Store)

# Run by hand: Actions → "Android release (Play Store)" → Run workflow → choose dev or prod.
# Builds a signed App Bundle (.aab) connected to the real Firebase project and attaches it to a
# draft GitHub release, ready to upload to Play Console.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions). Values are never printed:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   FIREBASE_ANDROID_API_KEY_<DEV|PROD>, FIREBASE_ANDROID_APP_ID_<DEV|PROD>, FIREBASE_SENDER_ID_<DEV|PROD>
# See docs/LAUNCH.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Firebase project
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'prod' && 'production' || 'development' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    env:
      PROJECT: ${{ inputs.target == 'prod' && 'onlineland-prod' || 'onlineland-dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check secrets are present (values are not shown)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          API: ${{ inputs.target == 'prod' && secrets.FIREBASE_ANDROID_API_KEY_PROD || secrets.FIREBASE_ANDROID_API_KEY_DEV }}
          APP: ${{ inputs.target == 'prod' && secrets.FIREBASE_ANDROID_APP_ID_PROD || secrets.FIREBASE_ANDROID_APP_ID_DEV }}
        run: |
          missing=0
          [ -n "$KS" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; missing=1; }
          [ -n "$API" ] || { echo "::error::Firebase Android API key for $PROJECT is not set"; missing=1; }
          [ -n "$APP" ] || { echo "::error::Firebase Android app id for $PROJECT is not set"; missing=1; }
          exit $missing

      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Tests
        run: flutter pub get && flutter test

      - name: Build signed App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API: ${{ inputs.target == 'prod' && secrets.FIREBASE_ANDROID_API_KEY_PROD || secrets.FIREBASE_ANDROID_API_KEY_DEV }}
          APP: ${{ inputs.target == 'prod' && secrets.FIREBASE_ANDROID_APP_ID_PROD || secrets.FIREBASE_ANDROID_APP_ID_DEV }}
          SENDER: ${{ inputs.target == 'prod' && secrets.FIREBASE_SENDER_ID_PROD || secrets.FIREBASE_SENDER_ID_DEV }}
        run: |
          flutter build appbundle --release \
            --dart-define=DATA_MODE=firebase \
            --dart-define=FIREBASE_PROJECT_ID=$PROJECT \
            --dart-define=FIREBASE_API_KEY=$API \
            --dart-define=FIREBASE_APP_ID=$APP \
            --dart-define=FIREBASE_SENDER_ID=$SENDER \
            --dart-define=FIREBASE_STORAGE_BUCKET=$PROJECT.firebasestorage.app \
            --build-name=1.0.${{ github.run_number }} --build-number=$((100 + ${{ github.run_number }}))
          cp build/app/outputs/bundle/release/app-release.aab "onlineland-$PROJECT-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ inputs.target }}-${{ github.run_number }}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "OnlineLand app 1.0.${{ github.run_number }} ($PROJECT)" \
            --notes "Signed App Bundle for Play Console. Firebase project: $PROJECT."
          gh release upload "$TAG" onlineland-*.aab
