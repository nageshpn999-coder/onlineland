name: CI

# Runs on the new-platform branch only; the live site on main is not affected.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  setup-check:
    name: Install, type-check, lint, build, Firebase tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -w @onlineland/web

      - name: Build website
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Emulators + basic rules check
        run: npm run emulators:check

      - name: Firebase rules + Cloud Functions tests
        run: npm run test:firebase

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Website browser tests (emulators + seeded test data)
        run: npm run test:e2e

      - name: Print screenshots (for review from the log)
        if: always()
        run: |
          for f in apps/web/test-results/screens/*.png; do
            [ -f "$f" ] || continue
            echo "SCREEN-BEGIN $(basename "$f")"; base64 -w 120 "$f"; echo "SCREEN-END"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: |
            apps/web/test-results/
          retention-days: 14
