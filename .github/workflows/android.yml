name: Android app

on:
  push:
    branches: [develop]
    paths: ['apps/android/**', 'packages/shared/src/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**']

jobs:
  app:
    name: Analyze, test, build demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to publish the demo APK as a GitHub pre-release
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

      - name: Build demo APK (sample data, no Firebase)
        run: |
          flutter build apk --release \
            --dart-define=DATA_MODE=demo \
            --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk onlineland-demo.apk
          ls -la onlineland-demo.apk

      - name: Publish demo APK (pre-release "android-demo")
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Demo APK for testing on your phone. Sample listings only; nothing is saved. Login: any number, OTP 123456. Build ${{ github.run_number }} from ${GITHUB_SHA::7}."
          gh release view android-demo >/dev/null 2>&1 || gh release create android-demo --prerelease --target develop --title "OnlineLand app — demo" --notes "$NOTES"
          gh release edit android-demo --notes "$NOTES" --prerelease
          gh release upload android-demo onlineland-demo.apk --clobber
