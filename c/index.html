<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScrapLake — Sell Your Scrap</title>

<!-- ── WhatsApp / సోషల్ preview (OG tags) ── -->
<meta property="og:type" content="website" />
<meta property="og:title" content="ScrapLake — Sell Your Scrap" />
<meta property="og:description" content="కార్టన్లు & ఇనుప స్క్రాప్ కొనుగోలు • కొల్లూరు, సంగారెడ్డి. కాల్ / WhatsApp ఒక్క tap. ఉ.6 – రా.10." />
<meta property="og:image" content="https://onlineland.in/c/scraplake/preview.jpg" />
<meta property="og:url" content="https://onlineland.in/c/scraplake/" />
<meta name="twitter:card" content="summary_large_image" />

<!-- ╔══════════════════════════════════════════════╗
     ║  ScrapLake — వివరాలు మార్చడానికి కింది CONFIG  ║
     ╚══════════════════════════════════════════════╝ -->
<script>
const CARD = {
  brand:    "ScrapLake",
  tagline:  "Sell Your Scrap • స్క్రాప్ అమ్మండి",

  // ── మేము కొంటాం (We Buy) ──
  buys: [
    { icon:"box",     te:"కార్టన్లు కొంటాం",    en:"Cartons" },
    { icon:"recycle", te:"ఇనుప స్క్రాప్ కొంటాం", en:"Iron Scrap" },
  ],

  // ── యజమానులు (ప్రతి ఒక్కరికీ Call + WhatsApp) ──
  owners: [
    { name:"P. రాజు",           phone:"919515624416", whatsapp:"919515624416" },
    { name:"P. చంద్రశేఖర్",      phone:"919553634973", whatsapp:"919553634973" },
  ],
  waText: "నమస్తే, నా దగ్గర స్క్రాప్ ఉంది — ధర చెప్పండి",

  hours:   "ఉ. 6:00 – రా. 10:00",
  address: "కొల్లూరు, సంగారెడ్డి జిల్లా",      // ← exact landmark పెడితే మంచిది
  maps:    "https://maps.app.goo.gl/RN7nk4wUoBhjKUkPA",  // 'దారి' button
  upi:     "",                              // ← UPI పెడితే 'పే' వస్తుంది (seller కి pay చేయడానికి)
  upiName: "ScrapLake",
};
const MAKER = {
  label: "Powered by OnlineLand",
  url:   "https://wa.me/919959731120?text=" + encodeURIComponent("నాకూ ఇలాంటి డిజిటల్ కార్డ్ కావాలి"),
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0C1E33; --navy2:#081320;
    --emerald:#13C28A; --emerald-d:#0E9D70;
    --orange:#F6A02A;
    --text:#EAF2F8; --muted:#92A6BC;
    --glass:rgba(255,255,255,.06);
    --glass-2:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.12);
    --shadow:0 22px 60px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Poppins","Hind Guntur",sans-serif;
    background:#05080d;
    min-height:100dvh; display:flex; justify-content:center; align-items:flex-start;
    padding:20px 13px 118px; color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .te{font-family:"Hind Guntur","Poppins",sans-serif}

  .card{
    width:100%; max-width:430px; position:relative; overflow:hidden;
    border-radius:28px;
    background:
      radial-gradient(110% 70% at 12% 0%, #15405a 0%, var(--navy) 42%, var(--navy2) 100%);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06);
    opacity:0; transform:translateY(14px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}
  .card::before{ /* industrial glow */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 88% 8%, rgba(19,194,138,.20), transparent 40%),
      radial-gradient(circle at 6% 92%, rgba(246,160,42,.16), transparent 42%);
  }
  .card::after{ /* faint diagonal industrial lines */
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.05;
    background:repeating-linear-gradient(135deg, #fff 0 1px, transparent 1px 16px);
  }

  .inner{position:relative; z-index:2; padding:22px 22px 22px}

  /* ── brand ── */
  .brandwrap{text-align:center; margin-bottom:12px}
  .mark{
    width:72px; height:72px; margin:0 auto 10px; border-radius:20px;
    background:linear-gradient(145deg, rgba(19,194,138,.25), rgba(246,160,42,.16));
    border:1px solid var(--line); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 28px -10px rgba(0,0,0,.6);
  }
  .mark svg{width:40px; height:40px}
  .brand{font-family:"Poppins"; font-weight:800; font-size:30px; letter-spacing:-.01em; line-height:1}
  .brand b{color:var(--emerald)} /* "Lake" accent */
  .tagline{font-family:"Poppins"; font-weight:500; font-size:13.5px; color:var(--orange); margin-top:8px; letter-spacing:.02em}

  /* ── glass panel ── */
  .panel{
    background:var(--glass); border:1px solid var(--line); border-radius:18px;
    backdrop-filter:blur(8px); padding:15px 16px; margin-top:14px;
  }
  .panel h3{
    font-family:"Hind Guntur"; font-size:11.5px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:12px;
    display:flex; align-items:center; gap:7px;
  }
  .panel h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}

  /* ── we buy ── */
  .buy{display:flex; align-items:center; gap:13px; padding:9px 0}
  .buy + .buy{border-top:1px solid rgba(255,255,255,.07)}
  .buy .bi{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:rgba(19,194,138,.14); border:1px solid rgba(19,194,138,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .buy .bi svg{width:23px;height:23px;stroke:var(--emerald);fill:none;stroke-width:1.9}
  .buy .bt{font-family:"Hind Guntur"; font-size:15.5px; font-weight:600}
  .buy .bt small{display:block;font-family:"Poppins";font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}

  /* ── owners ── */
  .owner{padding:12px 0}
  .owner + .owner{border-top:1px solid rgba(255,255,255,.08)}
  .owner .top{display:flex; align-items:center; gap:11px; margin-bottom:10px}
  .owner .oi{
    width:38px;height:38px;border-radius:50%;flex:none;
    background:linear-gradient(145deg,var(--emerald-d),#0b6f50);
    display:flex;align-items:center;justify-content:center;
    font-family:"Poppins";font-weight:700;font-size:16px;color:#fff;
  }
  .owner .nm{font-family:"Hind Guntur";font-size:16px;font-weight:600;line-height:1.2}
  .owner .nm small{display:block;font-family:"Poppins";font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em;margin-top:1px}
  .owner .btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .obtn{
    appearance:none;cursor:pointer;text-decoration:none;
    border-radius:12px;padding:11px 8px;display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:"Hind Guntur";font-weight:600;font-size:13.5px;
    transition:transform .12s ease, filter .2s ease;
  }
  .obtn:active{transform:scale(.95)}
  .obtn.call{background:var(--orange);color:#241500}
  .obtn.wa{background:var(--emerald);color:#04241a}
  .obtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}

  .dirbtn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin-top:12px;padding:13px;border-radius:13px;text-decoration:none;
    background:rgba(19,194,138,.12);border:1px solid rgba(19,194,138,.4);color:var(--emerald);
    font-family:"Hind Guntur";font-weight:600;font-size:14.5px;
    transition:transform .12s ease, background .2s ease;
  }
  .dirbtn:active{transform:scale(.97)}
  .dirbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9}
  .dirbtn.hide{display:none}

  /* ── meta rows ── */
  .meta{display:flex;align-items:center;gap:12px;padding:10px 0}
  .meta + .meta{border-top:1px solid rgba(255,255,255,.07)}
  .meta .mi{width:20px;height:20px;flex:none;stroke:var(--orange);fill:none;stroke-width:1.8}
  .meta .mv{font-family:"Hind Guntur";font-size:14.5px;line-height:1.45}
  .meta .mv small{display:block;font-family:"Poppins";color:var(--muted);font-size:11px;font-weight:500;margin-bottom:1px}
  .meta.link{text-decoration:none;color:var(--text)}

  .made{text-align:center;padding:20px 0 4px}
  .made a{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.02em}
  .made a b{color:var(--emerald)}

  /* ── sticky bar ── */
  .bar{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:rgba(5,12,20,.9);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex;gap:8px;padding:11px 13px calc(11px + env(safe-area-inset-bottom));justify-content:center;
  }
  .bar button{
    appearance:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);
    font-family:"Hind Guntur";font-weight:600;font-size:13.5px;border-radius:13px;
    padding:11px 10px;flex:1;max-width:165px;display:flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .12s ease;
  }
  .bar button:active{transform:scale(.95)}
  .bar button.save{background:var(--orange);border-color:var(--orange);color:#241500}
  .bar button .ic{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none}

  /* ── QR modal ── */
  .modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,8,14,.8);backdrop-filter:blur(4px)}
  .modal.open{display:flex}
  .qr-card{background:#0E2236;border:1px solid var(--line);border-radius:22px;padding:26px 26px 22px;text-align:center;max-width:300px;width:100%;box-shadow:var(--shadow)}
  .qr-card h4{font-family:"Hind Guntur";font-size:15px;margin-bottom:4px}
  .qr-card p{font-size:11.5px;color:var(--muted);margin-bottom:16px}
  #qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:14px}
  .qr-close{margin-top:18px;width:100%;appearance:none;border:none;cursor:pointer;background:var(--emerald);color:#04241a;font-family:"Hind Guntur";font-weight:700;font-size:14px;padding:12px;border-radius:12px}

  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:#0E2236;border:1px solid var(--line);color:var(--text);font-family:"Hind Guntur";font-size:13px;padding:11px 18px;border-radius:999px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="card">
  <div class="inner">

    <div class="brandwrap">
      <div class="mark">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
            <path d="M24 9l5 8.7H19L24 9z" fill="#13C28A" stroke="#13C28A"/>
            <path d="M14.5 26.5L9.5 35.2 19 35.2" fill="#F6A02A" stroke="#F6A02A"/>
            <path d="M33.5 26.5l5 8.7H29" fill="#13C28A" stroke="#13C28A"/>
            <path d="M24 9c-3 0-5.6 1.6-7 4.1" stroke="#F6A02A"/>
            <path d="M38.5 35.2c1.5-2.6 1.6-5.7.1-8.3" stroke="#13C28A"/>
            <path d="M9.5 35.2c1.5 2.6 4.2 4.1 7.2 4.1" stroke="#F6A02A"/>
          </g>
        </svg>
      </div>
      <div class="brand">Scrap<b>Lake</b></div>
      <div class="tagline te" id="tagline"></div>
    </div>

    <section class="panel">
      <h3 class="te"><span class="dot"></span>యజమానులు • Proprietors</h3>
      <div id="owners"></div>
      <a class="dirbtn te" id="dirbtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.7-7-11a7 7 0 0114 0c0 4.3-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        దారి చూపించు • Location
      </a>
    </section>

    <section class="panel">
      <h3 class="te"><span class="dot"></span>మేము కొంటాం • We Buy</h3>
      <div id="buys"></div>
    </section>

    <section class="panel" id="metaPanel">
      <div id="meta"></div>
    </section>

    <div class="made"><a id="made" href="#" target="_blank" rel="noopener"></a></div>
  </div>
</main>

<div class="bar">
  <button class="save" onclick="saveContact()">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> కాంటాక్ట్ సేవ్
  </button>
  <button onclick="shareCard()">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg> షేర్
  </button>
  <button onclick="openQR()">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg> QR
  </button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeQR()">
  <div class="qr-card">
    <h4 class="te">WhatsApp లో సంప్రదించండి</h4>
    <p>Scan to Contact on WhatsApp</p>
    <div id="qr"></div>
    <button class="qr-close te" onclick="closeQR()">మూసివేయి</button>
  </div>
</div>

<div class="toast te" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

$('tagline').textContent = CARD.tagline;

// directions button
if(CARD.maps){ $('dirbtn').href = CARD.maps; }
else { $('dirbtn').classList.add('hide'); }

const BIC={
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  recycle:'<path d="M7 19l-3-5 3-1M17 19l3-5-3-6-4 1M9 5l3-3 3 4"/><path d="M4 14l3 5h6"/>',
};
$('buys').innerHTML = CARD.buys.map(b=>`
  <div class="buy">
    <div class="bi"><svg viewBox="0 0 24 24">${BIC[b.icon]||BIC.box}</svg></div>
    <div class="bt te">${esc(b.te)}<small>${esc(b.en)}</small></div>
  </div>`).join('');

const ICall='<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.6A2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.6a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.5-1.2a2 2 0 012.1-.5c.8.3 1.7.6 2.6.7a2 2 0 011.7 2z"/>';
const IWa='<path d="M21 11.5a8.4 8.4 0 01-12.6 7.3L3 21l2.3-5.3A8.5 8.5 0 1121 11.5z"/>';
$('owners').innerHTML = CARD.owners.map(o=>`
  <div class="owner">
    <div class="top">
      <div class="oi">${(o.name||'•').replace(/[^A-Za-z\u0C00-\u0C7F]/g,'').charAt(0)||'•'}</div>
      <div class="nm te">${esc(o.name)}<small>+${o.phone}</small></div>
    </div>
    <div class="btns">
      <a class="obtn call" href="tel:+${o.phone}"><svg viewBox="0 0 24 24">${ICall}</svg><span class="te">కాల్</span></a>
      <a class="obtn wa" href="https://wa.me/${o.whatsapp}?text=${encodeURIComponent(CARD.waText||'')}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">${IWa}</svg><span>WhatsApp</span></a>
    </div>
  </div>`).join('');

// meta rows
const rows=[];
if(CARD.hours) rows.push(`<div class="meta"><svg class="mi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="mv te"><small>పని వేళలు / Hours</small>${esc(CARD.hours)}</div></div>`);
if(CARD.address) rows.push(`<a class="meta link" href="${CARD.maps||'#'}" ${CARD.maps?'target="_blank" rel="noopener"':''}><svg class="mi" viewBox="0 0 24 24"><path d="M12 21s-7-6.7-7-11a7 7 0 0114 0c0 4.3-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg><div class="mv te"><small>చిరునామా / Address</small>${esc(CARD.address)}</div></a>`);
$('meta').innerHTML = rows.join('');
if(!rows.length) $('metaPanel').style.display='none';

$('made').href=MAKER.url;
$('made').innerHTML=`<b>●</b> ${esc(MAKER.label)}`;

// vCard with both numbers
function saveContact(){
  const lines=["BEGIN:VCARD","VERSION:3.0","FN:ScrapLake","ORG:ScrapLake"];
  CARD.owners.forEach(o=>lines.push(`TEL;TYPE=CELL:+${o.phone}`));
  if(CARD.address) lines.push(`ADR;TYPE=WORK:;;${CARD.address};;;;`);
  lines.push("NOTE:"+CARD.owners.map(o=>o.name).join(", "));
  lines.push("END:VCARD");
  const blob=new Blob([lines.join("\r\n")],{type:"text/vcard"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ScrapLake.vcf";a.click();
  toast("కాంటాక్ట్ సేవ్ అవుతోంది ✓");
}
async function shareCard(){
  const url=location.href;
  if(navigator.share){try{await navigator.share({title:"ScrapLake",url});return;}catch(e){}}
  try{await navigator.clipboard.writeText(url);toast("లింక్ కాపీ అయింది ✓");}catch(e){toast(url);}
}
let qrDone=false;
function openQR(){
  $('modal').classList.add('open');
  if(!qrDone && window.QRCode){
    const wa="https://wa.me/"+CARD.owners[0].whatsapp;
    new QRCode($('qr'),{text:wa,width:180,height:180,colorDark:"#0C1E33",colorLight:"#ffffff"});
    qrDone=true;
  } else if(!window.QRCode){$('qr').innerHTML='<p style="font-size:12px;color:#444">QR కోసం ఇంటర్నెట్ అవసరం</p>';}
}
function closeQR(){$('modal').classList.remove('open');}
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}
</script>
</body>
</html>
