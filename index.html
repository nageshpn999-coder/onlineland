<style>
:root{
  /* నీలం (blue) పాలెట్ — వేరియబుల్ పేర్లు పాతవే ఉంచాం, విలువలు మాత్రమే మారాయి */
  --green:#123A63;--green2:#1B5A96;--green3:#3A8DD8;
  --gold:#C8922A;--gold2:#E8B84B;--gold3:#FDD87A;
  --earth:#F5EDD6;--earth2:#EDE0BC;--earth3:#D4C49A;
  --dark:#071A2E;--text:#14263D;--muted:#5E7793;
  --white:#FDFAF4;--red:#C0392B;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(253,250,244,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(200,146,42,.2);transition:box-shadow .3s}
nav.scrolled{box-shadow:0 4px 30px rgba(18,58,99,.12)}
.logo{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--green);text-decoration:none}
.logo span{color:var(--gold)}
.nav-right{display:flex;gap:1rem;align-items:center}
.nav-link{font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-link:hover{color:var(--green)}
.btn-admin{background:var(--green);color:#fff;padding:.45rem 1.1rem;border-radius:6px;font-size:.82rem;font-weight:700;border:none;cursor:pointer;transition:background .2s}
.btn-admin:hover{background:var(--green2)}

/* HERO */
.hero{min-height:100vh;display:grid;place-items:center;padding:7rem 2rem 6rem;background:linear-gradient(150deg,var(--dark) 0%,var(--green) 60%,#2B6CA8 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 85%,rgba(200,146,42,.18) 0%,transparent 50%),radial-gradient(ellipse at 85% 15%,rgba(58,141,216,.1) 0%,transparent 45%)}
.hero-dots{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(circle,rgba(200,146,42,1) 1px,transparent 1px);background-size:32px 32px}
.hero-content{position:relative;text-align:center;max-width:760px}
.hero-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(200,146,42,.15);border:1px solid rgba(200,146,42,.35);color:var(--gold3);border-radius:100px;padding:.4rem 1.2rem;font-size:.78rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:1.8rem;animation:fadeUp .6s .1s both}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,5.5vw,4.5rem);font-weight:900;line-height:1.1;color:#fff;margin-bottom:1.2rem;animation:fadeUp .6s .25s both}
.hero h1 em{color:var(--gold2);font-style:normal}
.hero p{font-size:1.05rem;color:rgba(245,237,214,.7);line-height:1.8;max-width:500px;margin:0 auto 2.5rem;font-weight:300;animation:fadeUp .6s .4s both}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;animation:fadeUp .6s .55s both}
.btn-gold{background:var(--gold);color:var(--dark);padding:.85rem 2rem;border-radius:8px;font-weight:700;font-size:.95rem;text-decoration:none;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(200,146,42,.4);transition:all .25s}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(200,146,42,.5)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);padding:.85rem 2rem;border-radius:8px;font-weight:500;font-size:.95rem;text-decoration:none;cursor:pointer;transition:all .25s}
.btn-ghost:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);transform:translateY(-2px)}
.hero-stats{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(7,26,46,.4);backdrop-filter:blur(8px);border-top:1px solid rgba(200,146,42,.15);animation:fadeUp .6s .7s both}
.hstat{flex:1;max-width:180px;padding:1.3rem .8rem;text-align:center;border-right:1px solid rgba(200,146,42,.12)}
.hstat:last-child{border-right:none}
.hstat-n{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--gold2)}
.hstat-l{font-size:.7rem;color:rgba(245,237,214,.5);letter-spacing:.8px;text-transform:uppercase;margin-top:.15rem}

/* SEARCH */
.search-wrap{background:var(--white);padding:3rem 2rem;border-bottom:1px solid var(--earth2)}
.search-box{max-width:900px;margin:0 auto;background:#fff;border:1.5px solid var(--earth3);border-radius:16px;padding:1.8rem;box-shadow:0 6px 40px rgba(18,58,99,.07)}
.search-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--green);margin-bottom:1.2rem;text-align:center}
.search-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-items:end}
.sf label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:.35rem}
.sf select,.sf input{width:100%;padding:.65rem 1rem;border:1.5px solid var(--earth3);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--text);background:var(--earth);outline:none;transition:border-color .2s}
.sf select:focus,.sf input:focus{border-color:var(--green3)}
.btn-search{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.7rem 1.5rem;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;transition:background .2s,transform .2s}
.btn-search:hover{background:var(--green2);transform:translateY(-1px)}

/* LISTINGS */
.listings{padding:4.5rem 2rem;background:var(--earth)}
.sec-hd{text-align:center;margin-bottom:2.8rem}
.sec-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.sec-title{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,3vw,2.5rem);font-weight:700;color:var(--green);line-height:1.2}
.sec-sub{color:var(--muted);font-size:.92rem;margin-top:.6rem;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;max-width:1200px;margin:0 auto}

/* CARDS */
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--earth2);transition:transform .3s,box-shadow .3s;cursor:pointer}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 45px rgba(18,58,99,.12)}
.card-img{height:200px;position:relative;overflow:hidden;background:var(--green)}
.card-photo{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-photo{transform:scale(1.06)}
.card-no-photo{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green),var(--green2));color:rgba(255,255,255,.4);font-size:.8rem;gap:.5rem}
.card-no-photo span{font-size:2.5rem}
.card-badge{position:absolute;top:.8rem;left:.8rem;background:var(--gold);color:var(--dark);font-size:.65rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:.28rem .7rem;border-radius:100px}
.card-sold{background:var(--red)!important;color:#fff!important}
.card-body{padding:1.2rem}
.card-loc{font-size:.75rem;color:var(--muted);margin-bottom:.4rem}
.card-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--green);margin-bottom:.5rem;line-height:1.3}
.card-det{font-size:.78rem;color:var(--muted);margin-bottom:.25rem}
.card-det strong{color:var(--text)}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:.9rem;border-top:1px solid var(--earth);margin-top:.5rem}
.card-price{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--green)}
.card-price small{font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:400;color:var(--muted);display:block}
.card-contacts{display:flex;gap:.4rem}
.btn-wp{background:#25D366;color:#fff;border:none;padding:.4rem .85rem;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;transition:opacity .2s}
.btn-wp:hover{opacity:.85}
.btn-ph{background:var(--green);color:#fff;border:none;padding:.4rem .85rem;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;transition:opacity .2s}
.btn-ph:hover{opacity:.85}
.empty-state{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-state .es-icon{font-size:3rem;margin-bottom:1rem}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(7,26,46,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-imgs{height:260px;overflow:hidden;border-radius:20px 20px 0 0;background:var(--green)}
.modal-imgs img{width:100%;height:100%;object-fit:cover}
.no-photo-lg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;color:rgba(255,255,255,.4);font-size:.85rem}
.no-photo-lg span{font-size:4rem}
.modal-body{padding:1.8rem}
.modal-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--green);margin-bottom:.3rem}
.modal-loc{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.2rem}
.mdet{background:var(--earth);border-radius:8px;padding:.7rem 1rem}
.mdet-l{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:.2rem}
.mdet-v{font-size:.95rem;font-weight:600;color:var(--text)}
.modal-price{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--green);margin-bottom:1.2rem}
.modal-btns{display:flex;gap:.8rem;flex-wrap:wrap}
.modal-btns a{flex:1;min-width:120px;padding:.75rem;border-radius:8px;font-weight:700;font-size:.9rem;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:opacity .2s}
.modal-btns a:hover{opacity:.85}
.modal-close{position:absolute;top:1rem;right:1rem;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15)}

/* ADMIN LOGIN */
.admin-login{display:none;position:fixed;inset:0;z-index:400;background:rgba(7,26,46,.88);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.admin-login.open{display:flex}
.login-box{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:380px;text-align:center}
.login-box h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--green);margin-bottom:.4rem}
.login-box p{font-size:.85rem;color:var(--muted);margin-bottom:1.5rem}
.login-field{margin-bottom:1rem;text-align:left}
.login-field label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:.3rem}
.login-field input{width:100%;padding:.7rem 1rem;border:1.5px solid var(--earth2);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--green3)}
.login-err{color:var(--red);font-size:.8rem;margin-bottom:.8rem;display:none}
.btn-login{width:100%;background:var(--green);color:#fff;border:none;padding:.8rem;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;transition:background .2s}
.btn-login:hover{background:var(--green2)}
.btn-cancel-login{width:100%;background:transparent;color:var(--muted);border:1.5px solid var(--earth2);padding:.7rem;border-radius:8px;font-weight:500;font-size:.88rem;cursor:pointer;margin-top:.6rem;transition:border-color .2s}
.btn-cancel-login:hover{border-color:var(--muted)}

/* ADMIN PANEL */
.admin-panel{display:none;position:fixed;inset:0;z-index:300;background:var(--white);overflow-y:auto}
.admin-panel.open{display:block}
.admin-nav{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;position:sticky;top:0;z-index:10}
.admin-logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold2)}
.admin-logo span{font-size:.7rem;font-weight:400;color:rgba(255,255,255,.4);margin-left:.5rem}
.btn-close-admin{background:rgba(255,255,255,.1);color:#fff;border:none;padding:.4rem 1rem;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;transition:background .2s}
.btn-close-admin:hover{background:rgba(255,255,255,.2)}
.admin-body{max-width:1100px;margin:0 auto;padding:2rem}
.admin-tabs{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:2px solid var(--earth2)}
.atab{padding:.6rem 1.4rem;font-weight:700;font-size:.88rem;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.atab.active{color:var(--green);border-bottom-color:var(--green)}

/* FORM */
.add-form{background:#fff;border-radius:16px;border:1px solid var(--earth2);padding:2rem}
.add-form h3{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--green);margin-bottom:1.5rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-grid.one{grid-template-columns:1fr}
.ff{display:flex;flex-direction:column;gap:.35rem}
.ff label{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.ff.req label::after{content:' *';color:var(--red)}
.ff input,.ff select,.ff textarea{padding:.65rem 1rem;border:1.5px solid var(--earth2);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);background:var(--earth);outline:none;transition:border-color .2s}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--green3);background:#fff}
.ff textarea{resize:vertical;min-height:80px}

/* photo upload */
.photo-upload{border:2px dashed var(--earth3);border-radius:12px;padding:1.8rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.photo-upload:hover{border-color:var(--green3);background:rgba(58,141,216,.03)}
.photo-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-upload .pu-icon{font-size:2rem;margin-bottom:.5rem}
.photo-upload p{font-size:.85rem;color:var(--muted)}
.photo-upload small{font-size:.72rem;color:var(--earth3)}
.photo-previews{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.photo-preview{width:80px;height:60px;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--earth2)}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.del-photo{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(192,57,43,.9);color:#fff;border:none;cursor:pointer;font-size:.65rem;display:grid;place-items:center}

/* patta */
.patta-opts{display:flex;flex-wrap:wrap;gap:.5rem}
.patta-opt{padding:.35rem .9rem;border-radius:100px;font-size:.78rem;font-weight:600;border:1.5px solid var(--earth2);color:var(--muted);cursor:pointer;transition:all .2s;background:transparent}
.patta-opt.selected{background:var(--green);color:#fff;border-color:var(--green)}

.form-actions{display:flex;gap:.8rem;margin-top:1.5rem}
.btn-save{background:var(--green);color:#fff;border:none;padding:.75rem 2rem;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;transition:background .2s}
.btn-save:hover{background:var(--green2)}
.btn-reset-f{background:transparent;color:var(--muted);border:1.5px solid var(--earth2);padding:.75rem 1.5rem;border-radius:8px;font-weight:500;font-size:.9rem;cursor:pointer;transition:border-color .2s}
.btn-reset-f:hover{border-color:var(--muted)}
.form-msg{padding:.6rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;display:none;margin-top:.8rem}
.form-msg.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.form-msg.error{background:#fde8e8;color:var(--red);border:1px solid #f5b7b1}

/* manage table */
.manage-table{background:#fff;border-radius:16px;border:1px solid var(--earth2);overflow:hidden}
.manage-table table{width:100%;border-collapse:collapse}
.manage-table th{background:var(--dark);color:rgba(255,255,255,.8);font-size:.72rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:.9rem 1rem;text-align:left}
.manage-table td{padding:.85rem 1rem;border-bottom:1px solid var(--earth);font-size:.85rem;vertical-align:middle}
